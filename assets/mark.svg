<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The menu-bar mark, drawn on a 32px grid: at 16pt a scaled-down app icon
       turns into grey mush, so this is filled shapes with 4px strokes. -->
  <g fill="#000000">
    <rect x="3" y="7" width="4" height="18" rx="1.6"/>
    <rect x="3" y="7" width="8" height="4" rx="1.6"/>
    <rect x="3" y="21" width="8" height="4" rx="1.6"/>
    <rect x="25" y="7" width="4" height="18" rx="1.6"/>
    <rect x="21" y="7" width="8" height="4" rx="1.6"/>
    <rect x="21" y="21" width="8" height="4" rx="1.6"/>
    <rect x="13" y="13" width="6" height="6" rx="1.2"/>
  </g>
</svg>
