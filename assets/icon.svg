    <rect width="824" height="824" rx="185" fill="#108EE8"/>
    <!-- The harness: two brackets holding one prompt. -->
    <g transform="scale(0.804688)">
      <g fill="none" stroke="#FFFFFF" stroke-width="96" stroke-linecap="round" stroke-linejoin="round">
        <path d="M404 268h-92a20 20 0 0 0-20 20v448a20 20 0 0 0 20 20h92"/>
        <path d="M620 268h92a20 20 0 0 1 20 20v448a20 20 0 0 1-20 20h-92"/>
        <path d="M466 428l84 84-84 84"/>
      </g>
    </g>
  </g>
</svg>
